apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis-agent-memory
  labels:
    app.kubernetes.io/part-of: ram-harness
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-agent-memory
      app.kubernetes.io/instance: redis-agent-memory
      app.kubernetes.io/component: server
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
