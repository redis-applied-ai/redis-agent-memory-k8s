apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-agent-memory-server
  labels:
    app.kubernetes.io/part-of: ram-harness
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-agent-memory
      app.kubernetes.io/instance: redis-agent-memory
      app.kubernetes.io/component: server
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-agent-memory-worker
  labels:
    app.kubernetes.io/part-of: ram-harness
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-agent-memory
      app.kubernetes.io/instance: redis-agent-memory
      app.kubernetes.io/component: worker
