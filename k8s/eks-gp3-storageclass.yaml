# gp3 StorageClass backed by the AWS EBS CSI driver. Referenced by
# configs/redis-enterprise/operator.values.eks.yaml (storageClassName: gp3).
# WaitForFirstConsumer so the volume is created in the same AZ as the REC pod.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  fsType: ext4
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
